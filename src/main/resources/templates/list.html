<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список участников</title>
</head>
<body>
<h1>Список участников мероприятия</h1>

<form th:action="@{/search}" method="get" style="margin-bottom: 15px;">
    <input type="text" name="query" th:value="${searchQuery}" placeholder="Поиск по имени..." />
    <button type="submit">Искать</button>
    <a th:href="@{/}">Сбросить</a>
</form>

<a th:href="@{/register}">Зарегистрировать нового участника</a>
<hr>

<table border="1" cellpadding="8">
    <thead>
    <tr>
        <th>Имя</th>
        <th>Email</th>
        <th>Дата регистрации</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${participants}">
        <td th:text="${p.name}"></td>
        <td th:text="${p.email}"></td>
        <td th:text="${#temporals.format(p.registrationDate, 'dd.MM.yyyy HH:mm')}"></td>
        <td>
            <a th:href="@{/edit/{id}(id=${p.id})}">Редактировать</a> |
            <a th:href="@{/delete/{id}(id=${p.id})}"
               onclick="return confirm('Удалить участника?');">Удалить</a>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(participants)}">
        <td colspan="4">Участников не найдено.</td>
    </tr>
    </tbody>
</table>
</body>
</html>
